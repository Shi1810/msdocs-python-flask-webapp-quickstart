# Azure DevOps pipeline for deploying a Python app to Azure App Service (Linux)
# Save as azure-pipelines.yml in your repo root

trigger:
  branches:
    include:
      - main  # Change to your main branch

variables:
  # Set these variables or override in Pipeline UI
  azureSubscription: 'ShikhaAzureConnection'
  appName: 'pythonappsample'
  resourceGroupName: 'shikhajhatestingrg'
  pythonVersion: '3.13' # Change as needed

pool:
  vmImage: 'ubuntu-latest'

steps:

- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(pythonVersion)'
    addToPath: true

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install dependencies'

- script: |
    python -m pytest
  displayName: 'Run tests'
  # Remove if not using pytest

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
    replaceExistingArchive: true

- publish: '$(Build.ArtifactStagingDirectory)/app.zip'
  artifact: drop

- task: AzureWebApp@1
  displayName: 'Deploy to Azure Web App'
  inputs:
    azureSubscription: '$(azureSubscription)'
    appType: 'webAppLinux'
    appName: '$(appName)'
    package: '$(Build.ArtifactStagingDirectory)/app.zip'

